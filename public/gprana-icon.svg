<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gpg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3CE584"/>
      <stop offset="1" stop-color="#0EA653"/>
    </linearGradient>
    <linearGradient id="gpgH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CFFBC"/>
      <stop offset="1" stop-color="#17C964"/>
    </linearGradient>
    <mask id="gpmask">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="30" y="6" width="40" height="52" fill="#000"/>
    </mask>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0B1220"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#gpg)" stroke-width="2"/>

  <!-- letter G - globe-styled ring with right opening -->
  <g mask="url(#gpmask)" fill="none" stroke="url(#gpgH)" stroke-width="6.5" stroke-linecap="round">
    <path d="M25 19 A13 13 0 1 0 25 45 A13 13 0 1 0 25 19"/>
  </g>
  <path d="M14 32 L30.5 32" stroke="url(#gpgH)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- letter P - stem + bowl -->
  <g fill="none" stroke="url(#gpgH)" stroke-width="6.5" stroke-linecap="round">
    <path d="M46 19 L46 46"/>
    <path d="M46 19 A7.5 7.5 0 0 1 53.5 26.5 A7.5 7.5 0 0 1 46 34"/>
  </g>

  <!-- prana life-spark (brand continuity) -->
  <circle cx="50.5" cy="48" r="2.3" fill="#3CE584" opacity="0.9"/>
</svg>